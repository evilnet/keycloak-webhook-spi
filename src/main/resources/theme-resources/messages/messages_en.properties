irc-scram-display-name=IRC login (SCRAM)
irc-scram-help-text=This entry is created automatically when you sign in with your password, and is used for SCRAM logins on IRC.
irc-ecdsa-display-name=IRC login (ECDSA key)
irc-ecdsa-help-text=Your public key for ECDSA logins on IRC (SASL ECDSA-NIST256P-CHALLENGE). You can have one; adding another replaces it.
irc-ecdsa-enroll-title=Add an ECDSA key for IRC
irc-ecdsa-public-key=Public key
irc-ecdsa-enroll-help=Paste your P-256 public key: a PEM PUBLIC KEY block, the base64 of its DER form, or the base64 point that ecdsatool prints. It replaces any key you already have.
irc-ecdsa-invalid-key=That is not an ECDSA P-256 public key.
